<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>FleetWizards - Car Rental Management Software</title>
    <meta name="description" content="The operating system for car rental businesses. Manage your fleet, contracts, clients, invoices, and maintenance from one powerful platform built for rental agencies." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fleetwizards.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fleetwizards.com/" />
    <meta property="og:site_name" content="FleetWizards" />
    <meta property="og:title" content="FleetWizards - Car Rental Management Software" />
    <meta property="og:description" content="The operating system for car rental businesses. Manage your fleet, contracts, clients, invoices, and maintenance from one powerful platform built for rental agencies." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FleetWizards - Car Rental Management Software" />
    <meta name="twitter:description" content="The operating system for car rental businesses. Manage your fleet, contracts, clients, invoices, and maintenance from one powerful platform." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Non-blocking font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Static shell — visible immediately so crawlers/Lighthouse register FCP right away.
         Hidden the moment React mounts (MutationObserver below). -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#fff;color:#111827}
      #static-shell{min-height:100vh;display:flex;flex-direction:column}
      #static-shell.hidden{display:none}
      .ss-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid #f3f4f6}
      .ss-logo{font-size:1.25rem;font-weight:700;color:#111827;text-decoration:none}
      .ss-logo span{color:#2563eb}
      .ss-nav-links{display:flex;gap:24px;list-style:none}
      .ss-nav-links a{font-size:.9rem;color:#374151;text-decoration:none}
      .ss-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px 48px}
      .ss-badge{display:inline-flex;align-items:center;gap:8px;background:#f0f9ff;border:1px solid #bae6fd;color:#0369a1;font-size:.75rem;font-weight:600;letter-spacing:.05em;padding:4px 14px;border-radius:999px;margin-bottom:28px}
      .ss-h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;line-height:1.15;max-width:780px;color:#111827}
      .ss-h1 .blue{color:#2563eb}
      .ss-sub{margin-top:20px;font-size:1.05rem;color:#6b7280;max-width:560px;line-height:1.6}
      .ss-btns{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap;justify-content:center}
      .ss-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;font-size:.95rem;font-weight:600;text-decoration:none;cursor:pointer;border:none}
      .ss-btn-primary{background:#2563eb;color:#fff}
      .ss-btn-outline{background:#fff;color:#374151;border:1.5px solid #d1d5db}
      .ss-btn-demo{background:#991b1b;color:#fff}
      #root{display:none}
      #root.ready{display:block}
    </style>
  </head>

  <body>
    <!-- Static above-the-fold shell rendered before any JS loads -->
    <div id="static-shell" aria-hidden="true">
      <nav class="ss-nav">
        <a href="/" class="ss-logo">Fleet<span>Wizards</span></a>
        <ul class="ss-nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/signin">Sign In</a></li>
          <li><a href="/signup">Sign Up</a></li>
        </ul>
      </nav>
      <section class="ss-hero">
        <div class="ss-badge">&#9679;&nbsp;ENTERPRISE FLEET MANAGEMENT</div>
        <h1 class="ss-h1">The Operating System<br>for <span class="blue">Car Rental</span> Businesses</h1>
        <p class="ss-sub">Manage your fleet, contracts, clients, invoices, and maintenance — all from one powerful platform built for rental agencies.</p>
        <div class="ss-btns">
          <a href="/signin" class="ss-btn ss-btn-primary">Sign In</a>
          <a href="/signup" class="ss-btn ss-btn-outline">Sign Up</a>
          <a href="/demo" class="ss-btn ss-btn-demo">Try Live Demo</a>
        </div>
      </section>
    </div>

    <div id="root"></div>

    <script>
      // Once React mounts into #root, hide the static shell and show the app
      (function() {
        var shell = document.getElementById('static-shell');
        var root  = document.getElementById('root');
        var obs = new MutationObserver(function() {
          if (root && root.children.length > 0) {
            if (shell) shell.classList.add('hidden');
            root.classList.add('ready');
            obs.disconnect();
          }
        });
        obs.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
